# Auto-fix gstack skill symlinks and stubs on push to main.
# Runs fix-gstack-symlinks.sh and commits any changes with [skip ci].

name: Fix Symlinks

on:
  push:
    branches: [main]
    paths:
      - '.claude/skills/**'
      - 'skills/**'

concurrency:
  group: fix-symlinks-${{ github.ref }}
  # Queue subsequent runs instead of cancelling — a half-run fix can leave
  # main with inconsistent symlinks that the next run has to untangle.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  auto-fix:
    name: Auto-fix gstack symlinks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6

      - name: Check if symlinks need fixing
        id: check
        run: |
          if bash scripts/fix-gstack-symlinks.sh --check 2>&1; then
            echo "needs_fix=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_fix=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fix symlinks
        if: steps.check.outputs.needs_fix == 'true'
        run: bash scripts/fix-gstack-symlinks.sh

      - name: Commit fixes
        if: steps.check.outputs.needs_fix == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude/skills/ skills/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: auto-fix gstack symlinks [skip ci]"
          # Retry push with pull --rebase to handle concurrent writes to main
          attempt=0
          max_attempts=5
          until git push; do
            attempt=$((attempt + 1))
            if [ $attempt -ge $max_attempts ]; then
              echo "::error::Failed to push symlink fixes after $max_attempts attempts"
              exit 1
            fi
            echo "Push rejected (attempt $attempt/$max_attempts) — pulling rebased and retrying"
            sleep $((attempt * 2))
            git pull --rebase origin main
          done
